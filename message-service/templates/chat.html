<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Message Service</title>
    <link rel="stylesheet" href="/static/chat.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e2e;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: #252535;
            border-right: 1px solid #3a3a4a;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            background: #2a2a3a;
            border-bottom: 1px solid #3a3a4a;
        }

        .sidebar-header h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .user-info {
            font-size: 12px;
            color: #888;
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 11px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e74c3c;
        }

        .status-dot.connected {
            background: #27ae60;
        }

        .logout-btn {
            margin-top: 10px;
            padding: 6px 12px;
            background: transparent;
            border: 1px solid #666;
            color: #888;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .logout-btn:hover {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        .tabs {
            display: flex;
            background: #2a2a3a;
            border-bottom: 1px solid #3a3a4a;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            background: transparent;
            border: none;
            color: #888;
            font-size: 13px;
            transition: all 0.2s;
        }

        .tab:hover {
            background: rgba(102, 126, 234, 0.1);
        }

        .tab.active {
            background: #667eea;
            color: white;
        }

        .create-group-btn {
            margin: 12px 15px;
            padding: 10px;
            background: #667eea;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
        }

        .create-group-btn:hover {
            background: #5568d3;
        }

        .list-container {
            flex: 1;
            overflow-y: auto;
        }

        .section-label {
            padding: 10px 15px;
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: #1e1e2e;
        }

        .list-item {
            padding: 12px 15px;
            border-bottom: 1px solid #3a3a4a;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.2s;
        }

        .list-item:hover {
            background: #2a2a3a;
        }

        .list-item.active {
            background: #667eea;
        }

        .list-item.active .item-status {
            color: rgba(255,255,255,0.8);
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            position: relative;
            flex-shrink: 0;
        }

        .avatar.group {
            background: #9b59b6;
        }

        .online-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            background: #27ae60;
            border-radius: 50%;
            border: 2px solid #252535;
        }

        .item-info {
            flex: 1;
            min-width: 0;
        }

        .item-name {
            font-weight: 500;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item-status {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 15px 20px;
            background: #252535;
            border-bottom: 1px solid #3a3a4a;
            display: none;
            align-items: center;
            gap: 12px;
        }

        .chat-header.active {
            display: flex;
        }

        .chat-header .avatar {
            width: 40px;
            height: 40px;
        }

        .chat-header-info h3 {
            font-size: 16px;
            font-weight: 500;
        }

        .chat-header-info .status {
            font-size: 12px;
            color: #888;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #666;
        }

        .empty-state-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .empty-state-text {
            font-size: 16px;
        }

        .message {
            max-width: 65%;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
        }

        .message.sent {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message.received {
            align-self: flex-start;
            align-items: flex-start;
        }

        .message-sender {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
        }

        .message-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.sent .message-bubble {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.received .message-bubble {
            background: #2a2a3a;
            color: white;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 10px;
            color: #666;
            margin-top: 4px;
        }

        .input-container {
            padding: 15px 20px;
            background: #252535;
            border-top: 1px solid #3a3a4a;
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 18px;
            background: #1e1e2e;
            border: 1px solid #3a3a4a;
            border-radius: 25px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        #messageInput:focus {
            border-color: #667eea;
        }

        #messageInput:disabled {
            opacity: 0.5;
        }

        #sendBtn {
            padding: 12px 24px;
            background: #667eea;
            border: none;
            border-radius: 25px;
            color: white;
            font-weight: 500;
            cursor: pointer;
        }

        #sendBtn:hover:not(:disabled) {
            background: #5568d3;
        }

        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #252535;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 420px;
        }

        .modal-content h3 {
            margin-bottom: 20px;
            font-size: 18px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #aaa;
            font-size: 13px;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            background: #1e1e2e;
            border: 1px solid #3a3a4a;
            border-radius: 6px;
            color: white;
            font-size: 14px;
        }

        .members-list {
            max-height: 180px;
            overflow-y: auto;
            border: 1px solid #3a3a4a;
            border-radius: 6px;
            background: #1e1e2e;
        }

        .member-item {
            padding: 10px 12px;
            border-bottom: 1px solid #3a3a4a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .member-item:last-child {
            border-bottom: none;
        }

        .member-item input {
            width: 16px;
            height: 16px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
        }

        .btn-cancel {
            background: #444;
            color: white;
        }

        .btn-create {
            background: #667eea;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>💬 Messages</h2>
                <div class="user-info">
                    <div id="userEmail">Loading...</div>
                </div>
                <div class="connection-status">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Connecting...</span>
                </div>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            <div class="tabs">
                <button class="tab active" data-tab="users" onclick="switchTab('users')">👤 Users</button>
                <button class="tab" data-tab="groups" onclick="switchTab('groups')">👥 Groups</button>
            </div>

            <button class="create-group-btn" onclick="openCreateGroupModal()">➕ Create Group</button>

            <div class="list-container">
                <div id="usersList"></div>
                <div id="groupsList" style="display: none;"></div>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <div class="avatar" id="chatAvatar">?</div>
                <div class="chat-header-info">
                    <h3 id="chatName">Select a chat</h3>
                    <div class="status" id="chatStatus"></div>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="empty-state" id="emptyState">
                    <div class="empty-state-icon">💬</div>
                    <div class="empty-state-text">Select a user or group to start chatting</div>
                </div>
            </div>

            <div class="input-container">
                 <input type="file" id="imageInput" accept="image/*" style="display:none">
                 <button onclick="document.getElementById('imageInput').click()">📷</button>
                 <input type="text" id="messageInput" placeholder="Type a message..." disabled>
                 <button onclick="sendImage()">Send Image</button>
                 <button id="sendBtn" disabled>Send</button>
            </div>
        </div>
    </div>

    <!-- Create Group Modal -->
    <div class="modal" id="createGroupModal">
        <div class="modal-content">
            <h3>Create New Group</h3>
            <div class="form-group">
                <label>Group Name</label>
                <input type="text" id="groupNameInput" placeholder="Enter group name">
            </div>
            <div class="form-group">
                <label>Select Members</label>
                <div class="members-list" id="membersList"></div>
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeCreateGroupModal()">Cancel</button>
                <button class="btn-create" onclick="createGroup()">Create</button>
            </div>
        </div>
    </div>

    <script src="/static/chat.js"></script>
</body>
</html>
