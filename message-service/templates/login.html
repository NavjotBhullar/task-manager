<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth - Message Service</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-bottom: 2px solid #ddd;
        }

        .tab.active {
            border-bottom: 2px solid #667eea;
            font-weight: bold;
        }

        .form { display: none; }
        .form.active { display: block; }

        .form-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
        }

        input:focus {
            border-color: #667eea;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #5568d3;
        }

        .error { color: red; margin-top: 10px; text-align: center; }
        .success { color: green; margin-top: 10px; text-align: center; }
    </style>
</head>

<body>

<div class="container">
    <h1>🔐 Message Service</h1>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">Login</div>
        <div class="tab" onclick="switchTab('signup')">Signup</div>
    </div>

    <!-- LOGIN FORM -->
    <form id="loginForm" class="form active">
        <div class="form-group">
            <input type="email" id="loginEmail" placeholder="Email" required>
        </div>

        <div class="form-group">
            <input type="password" id="loginPassword" placeholder="Password" required>
        </div>

        <button type="submit">Login</button>
    </form>

    <!-- SIGNUP FORM -->
    <form id="signupForm" class="form">
        <div class="form-group">
            <input type="text" id="signupName" placeholder="Full Name" required>
        </div>

        <div class="form-group">
            <input type="email" id="signupEmail" placeholder="Email" required>
        </div>

        <div class="form-group">
            <input type="password" id="signupPassword" placeholder="Password" required>
        </div>

        <button type="submit">Create Account</button>
    </form>

    <div id="message"></div>
</div>

<script>
function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));

    if (tab === 'login') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('loginForm').classList.add('active');
    } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('signupForm').classList.add('active');
    }

    document.getElementById('message').textContent = '';
}

// ================= LOGIN =================
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    const messageDiv = document.getElementById('message');

    try {
        const res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (res.ok) {
            localStorage.setItem('token', data.access_token);
            localStorage.setItem('user_id', data.user_id);
            localStorage.setItem('email', data.email);

            messageDiv.className = 'success';
            messageDiv.textContent = '✅ Login successful! Redirecting...';

            setTimeout(() => {
                window.location.href = '/chat';
            }, 1000);

        } else {
            messageDiv.className = 'error';
            messageDiv.textContent = data.detail || 'Login failed';
        }

    } catch (err) {
        messageDiv.className = 'error';
        messageDiv.textContent = 'Connection error: ' + err.message;
    }
});

// ================= SIGNUP =================
document.getElementById('signupForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const name = document.getElementById('signupName').value;
    const email = document.getElementById('signupEmail').value;
    const password = document.getElementById('signupPassword').value;
    const messageDiv = document.getElementById('message');

    try {
        const res = await fetch('/auth/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                name: name,        // change to full_name if needed
                email: email,
                password: password
            })
        });

        const data = await res.json();

        if (res.ok) {
            messageDiv.className = 'success';
            messageDiv.textContent = '✅ Account created! Please login.';
            switchTab('login');

        } else {
            messageDiv.className = 'error';
            messageDiv.textContent = data.detail || 'Signup failed';
        }

    } catch (err) {
        messageDiv.className = 'error';
        messageDiv.textContent = 'Connection error: ' + err.message;
    }
});
</script>

</body>
</html>
